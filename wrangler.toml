name = "rald-search"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "rald-search"
SERVICE_VERSION = "1.0.0"
SEARCH_PROVIDER = "postgres"

[[routes]]
pattern = "search.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "279f321a984a4f3cb03bc041cb70b8a6"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — pushed via deploy.yml using: wrangler secret put <NAME>
# Required:
#   SUPABASE_URL (org secret)
#   SUPABASE_SERVICE_ROLE_KEY (org secret)
#   RALD_JWT_SECRET
