name = "rald-search"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "development"
SERVICE_NAME = "rald-search"
SERVICE_VERSION = "1.0.0"
SEARCH_PROVIDER = "postgres"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "placeholder-replace-with-actual-kv-id"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — set via: wrangler secret put <NAME>
# Required:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RALD_JWT_SECRET
# Optional (future providers):
#   MEILISEARCH_HOST
#   MEILISEARCH_API_KEY
#   OPENSEARCH_HOST
#   OPENSEARCH_API_KEY

[env.production]
name = "rald-search"
vars = { ENVIRONMENT = "production", SEARCH_PROVIDER = "postgres" }

[[env.production.routes]]
pattern = "search.rald.cloud/*"
zone_name = "rald.cloud"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_PRODUCTION_KV_ID"
