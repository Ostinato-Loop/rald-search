name = "rald-search"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "rald-search"
SERVICE_VERSION = "1.0.0"
SEARCH_PROVIDER = "postgres"

# Secrets — set via: wrangler secret put <NAME>
# Required:
#   SUPABASE_URL                — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY   — Supabase service role key
#   RALD_JWT_SECRET             — JWT signing secret (min 32 chars)
# Optional (for future providers):
#   MEILISEARCH_HOST            — Meilisearch host URL
#   MEILISEARCH_API_KEY         — Meilisearch master key
#   OPENSEARCH_HOST             — OpenSearch host URL
#   OPENSEARCH_API_KEY          — OpenSearch API key

[[routes]]
pattern = "search.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "placeholder-replace-with-actual-kv-id"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1
